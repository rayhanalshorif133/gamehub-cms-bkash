<!DOCTYPE html>
<html lang="en" class="dark"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameArena | Adaptive UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class', // Enable class-based dark mode
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .live-dot { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-[#050508] flex justify-center items-start min-h-screen">

    <div class="w-full max-w-[430px] bg-white dark:bg-[#0a0a12] min-h-screen text-slate-900 dark:text-white relative shadow-2xl flex flex-col transition-colors duration-300">
        
        <header class="sticky top-0 z-50 bg-white/80 dark:bg-[#0a0a12]/80 backdrop-blur-md px-5 py-4 flex items-center justify-between border-b border-gray-200 dark:border-white/5">
            <div class="text-xl font-bold tracking-tight">
                Game<span class="text-violet-600">Arena</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="theme-toggle" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 flex items-center justify-center active:scale-90 transition">
                    <span class="dark:hidden text-lg">🌙</span> <span class="hidden dark:inline text-lg">☀️</span> </button>
                
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-violet-600 to-indigo-500 flex items-center justify-center font-bold text-xs text-white ring-2 ring-violet-500/20">
                    AR
                </div>
            </div>
        </header>

        <main class="flex-1 pb-24">
            
            <section class="mx-4 mt-5 p-6 rounded-[2rem] bg-violet-600 dark:bg-violet-600/20 border border-violet-500/30 relative overflow-hidden text-white shadow-xl shadow-violet-500/20">
                <div class="absolute -right-4 -top-4 w-24 h-24 bg-white/20 blur-3xl rounded-full"></div>
                <span class="px-3 py-1 bg-white/20 backdrop-blur-md text-[10px] font-bold rounded-full uppercase tracking-widest">🔥 Hot Now</span>
                <h2 class="text-2xl font-bold leading-tight mt-4">World Cup <br>Sprint Royale</h2>
                <button class="w-full mt-6 bg-white dark:bg-violet-500 text-violet-600 dark:text-white py-3.5 rounded-2xl font-bold shadow-lg active:scale-95 transition">
                    Register Now
                </button>
            </section>

            <nav class="mt-8 px-5 overflow-x-auto no-scrollbar flex gap-3">
                <button class="px-6 py-2.5 bg-violet-600 text-white rounded-full text-sm font-semibold">All</button>
                <button class="px-6 py-2.5 bg-gray-200 dark:bg-white/5 border border-transparent dark:border-white/10 rounded-full text-sm font-medium text-gray-500 dark:text-white/50 whitespace-nowrap">Daily Cups</button>
                <button class="px-6 py-2.5 bg-gray-200 dark:bg-white/5 border border-transparent dark:border-white/10 rounded-full text-sm font-medium text-gray-500 dark:text-white/50 whitespace-nowrap">Major Weekly</button>
            </nav>

            <section class="mt-8 px-4">
                <h3 class="text-lg font-bold px-2 mb-4">Active Tournaments</h3>
                <div class="space-y-3">
                    <div class="p-4 bg-gray-50 dark:bg-white/[0.03] border border-gray-200 dark:border-white/10 rounded-[1.5rem] flex items-center gap-4">
                        <div class="w-14 h-14 bg-red-500/10 rounded-2xl flex items-center justify-center text-2xl shrink-0">🎮</div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-base truncate">Blitz Royale</h4>
                            <div class="flex items-center gap-1 text-[10px] text-red-500 font-bold mt-1">
                                <span class="w-1.5 h-1.5 bg-red-500 rounded-full live-dot"></span> LIVE
                            </div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-amber-500 font-bold text-sm">$50</div>
                            <button class="mt-2 text-[10px] bg-violet-600 text-white px-3 py-1.5 rounded-lg font-bold">PLAY</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="mt-8 px-4">
                <div class="bg-gray-50 dark:bg-[#11111d] border border-gray-200 dark:border-white/5 rounded-[2rem] overflow-hidden">
                    <div class="p-5 border-b border-gray-200 dark:border-white/5 flex justify-between items-center">
                        <h3 class="font-bold">Top Rankings</h3>
                    </div>
                    <div class="flex items-center gap-4 px-5 py-4">
                        <div class="w-6 text-amber-500 font-black italic">1</div>
                        <div class="w-9 h-9 rounded-full bg-violet-100 dark:bg-violet-600/20 text-violet-600 flex items-center justify-center text-[10px] font-black uppercase">ZK</div>
                        <div class="flex-1">
                            <div class="text-sm font-bold">ZeroKing</div>
                            <div class="text-[10px] text-gray-500 dark:text-white/30">9,840 Points</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white/95 dark:bg-[#0a0a12]/95 backdrop-blur-xl border-t border-gray-200 dark:border-white/10 px-4 py-4 flex items-center justify-around z-[100]">
            <a href="#" class="flex flex-col items-center gap-1 text-violet-600">
                <span class="text-xl">🏠</span>
                <span class="text-[10px] font-bold">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 opacity-30 dark:opacity-40">
                <span class="text-xl">🏆</span>
                <span class="text-[10px] font-bold">Matches</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1 opacity-30 dark:opacity-40">
                <span class="text-xl">💰</span>
                <span class="text-[10px] font-bold">Wallet</span>
            </a>
        </nav>

    </div>

    <script>
        $(document).ready(function() {
            // Check for saved theme in localStorage
            if (localStorage.getItem('theme') === 'light') {
                $('html').removeClass('dark');
            }

            // Toggle Theme on Click
            $('#theme-toggle').on('click', function() {
                $('html').toggleClass('dark');
                
                // Save preference
                if ($('html').hasClass('dark')) {
                    localStorage.setItem('theme', 'dark');
                } else {
                    localStorage.setItem('theme', 'light');
                }
            });
        });
    </script>
</body>
</html>
